<!-- ================= DEPOSIT JAVASCRIPT ================= -->
<script>

const NEXA_DEPOSIT_API = "https://nexamime-api.onrender.com";

let nexaDepositSelectedAddress = "";


async function nexaSelectDepositNetwork(code, element) {

    console.log("NexaMine Deposit:", code);

    /* Reset all cards */
    document
        .querySelectorAll(".nexa-deposit-network")
        .forEach(function(card) {

            card.style.borderColor = "#1b293b";
            card.style.boxShadow = "none";
            card.style.background = "#101824";

        });


    /* Selected card */
    element.style.borderColor = "#00e5ff";
    element.style.boxShadow = "0 0 20px rgba(0,229,255,.18)";
    element.style.background = "#111f2d";


    const walletBox =
        document.getElementById("nexaDepositWalletBox");

    const titleBox =
        document.getElementById("nexaDepositNetworkTitle");

    const addressBox =
        document.getElementById("nexaDepositAddress");

    const statusBox =
        document.getElementById("nexaDepositStatus");


    if (!walletBox || !titleBox || !addressBox || !statusBox) {

        console.error("NexaMine: Deposit elements missing");

        return;
    }


    /* Show wallet */
    walletBox.style.display = "block";

    titleBox.innerText =
        "Selected Network: " + code.toUpperCase();

    addressBox.innerText =
        "Loading wallet address...";

    statusBox.innerText =
        "Please wait...";

    nexaDepositSelectedAddress = "";


    try {

        const response = await fetch(
            NEXA_DEPOSIT_API + "/api/networks",
            {
                method: "GET",
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "API HTTP " + response.status
            );

        }


        const data = await response.json();

        console.log("NexaMine API:", data);


        if (
            !data.success ||
            !Array.isArray(data.networks)
        ) {

            throw new Error(
                "Invalid API response"
            );

        }


        const network =
            data.networks.find(function(item) {

                return item.code === code;

            });


        if (!network) {

            addressBox.innerText =
                "Network not found.";

            statusBox.innerText =
                "Please try another network.";

            return;

        }


        /* Disabled */
        if (network.deposit_enabled === false) {

            addressBox.innerText =
                "Deposit is currently disabled.";

            statusBox.innerText =
                "Please try another network.";

            return;

        }


        /* Address not configured */
        if (!network.deposit_address) {

            addressBox.innerText =
                "Wallet address is not configured yet.";

            statusBox.innerText =
                "Admin needs to configure this wallet address.";

            return;

        }


        /* Success */
        nexaDepositSelectedAddress =
            String(network.deposit_address);

        addressBox.innerText =
            nexaDepositSelectedAddress;

        statusBox.innerText =
            "Send only " +
            network.coin +
            " using " +
            network.network +
            " network.";

    }

    catch (error) {

        console.error(
            "NexaMine Deposit Error:",
            error
        );

        addressBox.innerText =
            "Unable to load wallet address.";

        statusBox.innerText =
            "API connection failed.";

    }

}


async function nexaCopyDepositAddress() {

    if (!nexaDepositSelectedAddress) {

        alert("No wallet address available.");

        return;

    }


    try {

        await navigator.clipboard.writeText(
            nexaDepositSelectedAddress
        );

        alert("Wallet address copied!");

    }

    catch (error) {

        const textarea =
            document.createElement("textarea");

        textarea.value =
            nexaDepositSelectedAddress;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        document.body.removeChild(textarea);

        alert("Wallet address copied!");

    }

}

</script>
