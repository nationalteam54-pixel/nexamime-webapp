<!-- ================= DEPOSIT LOGIC ================= -->
<script>

const NEXA_DEPOSIT_API =
    "https://nexamime-api.onrender.com";

let nexaDepositSelectedAddress = "";


async function nexaSelectDepositNetwork(code, element) {

    console.log("NexaMine Deposit Selected:", code);


    /* Remove old selection */
    document
        .querySelectorAll(".nexa-deposit-network")
        .forEach(function(card) {

            card.style.borderColor = "#1b293b";
            card.style.boxShadow = "none";
            card.style.background = "#101824";

        });


    /* Highlight selected card */
    element.style.borderColor = "#00e5ff";
    element.style.boxShadow =
        "0 0 20px rgba(0,229,255,0.18)";
    element.style.background = "#111f2d";


    const walletBox =
        document.getElementById("nexaDepositWalletBox");

    const networkTitle =
        document.getElementById("nexaDepositNetworkTitle");

    const addressBox =
        document.getElementById("nexaDepositAddress");

    const statusBox =
        document.getElementById("nexaDepositStatus");


    /* Show wallet box */
    walletBox.style.display = "block";


    networkTitle.innerText =
        "Selected Network: " + code.toUpperCase();

    addressBox.innerText =
        "Loading wallet address...";

    statusBox.innerText =
        "Please wait...";

    nexaDepositSelectedAddress = "";


    /* Scroll to wallet */
    setTimeout(function() {

        walletBox.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);


    try {

        const response =
            await fetch(
                NEXA_DEPOSIT_API +
                "/api/networks"
            );


        if (!response.ok) {

            throw new Error(
                "API HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "NexaMine API:",
            data
        );


        if (!data.success ||
            !Array.isArray(data.networks)) {

            throw new Error(
                "Invalid API response"
            );

        }


        const network =
            data.networks.find(function(item) {

                return item.code === code;

            });


        if (!network) {

            addressBox.innerText =
                "Network not found.";

            statusBox.innerText =
                "Please try again.";

            return;

        }


        /* Deposit disabled */
        if (network.deposit_enabled === false) {

            addressBox.innerText =
                "Deposit is currently disabled.";

            statusBox.innerText =
                "Please try another network.";

            return;

        }


        /* No wallet configured yet */
        if (!network.deposit_address) {

            addressBox.innerText =
                "Wallet address is not configured yet.";

            statusBox.innerText =
                "Admin needs to configure this wallet address.";

            return;

        }


        /* Success */
        nexaDepositSelectedAddress =
            network.deposit_address;


        addressBox.innerText =
            network.deposit_address;


        statusBox.innerText =
            "Send only " +
            network.coin +
            " using " +
            network.network +
            " network.";


    } catch (error) {

        console.error(
            "NexaMine Deposit Error:",
            error
        );


        addressBox.innerText =
            "Unable to load wallet address.";


        statusBox.innerText =
            "Please check your internet connection and try again.";

    }

}


async function nexaCopyDepositAddress() {

    if (!nexaDepositSelectedAddress) {

        alert(
            "No wallet address available."
        );

        return;

    }


    try {

        await navigator.clipboard.writeText(
            nexaDepositSelectedAddress
        );


        alert(
            "Wallet address copied!"
        );


    } catch (error) {

        /* Fallback copy method */

        const textArea =
            document.createElement("textarea");

        textArea.value =
            nexaDepositSelectedAddress;

        document.body.appendChild(
            textArea
        );

        textArea.select();

        document.execCommand("copy");

        document.body.removeChild(
            textArea
        );


        alert(
            "Wallet address copied!"
        );

    }

}

</script>
